# Alpenglow board profile template
#
# Copy to config/boards/<name>.conf and select with:  ./build.sh --board <name>
# Listed in:  ls config/boards/*.conf   (this template is excluded from the
# "available boards" hint and fails validation if selected as-is)
#
# build.sh sources this file with `set -eu`, so:
#   - required variables MUST be set (build fails early with a clear error)
#   - optional variables fall back to the defaults shown below

# ---------------------------------------------------------------------------
# Required
# ---------------------------------------------------------------------------

BOARD_NAME=""               # image name component: out/alpenglow-${BOARD_NAME}-*.img
ARCH=""                     # target arch, e.g. aarch64 (must match apk --arch)

# Partition layout (MBR), must match the board's official image:
BOOT_SIZE_MB=0              # boot partition size
LOGO_SIZE_MB=0              # logo partition size
ROOTFS_SIZE_MB=0            # rootfs partition size
BOOT_LBA=0                  # first sector of boot partition
LOGO_LBA=0                  # first sector of logo partition
ROOTFS_LBA=0                # first sector of rootfs partition

# ---------------------------------------------------------------------------
# Optional — build.sh defaults shown
# ---------------------------------------------------------------------------

# Serial console (inittab getty line is rewritten from these)
SERIAL_CONSOLE="ttyS0"      # default: ttyS0
SERIAL_BAUD="115200"        # default: 115200

# Build-time firmware sources (host side). All are optional: missing
# directories/files are skipped, so a board without e.g. wiringX just
# omits it from the image.
#FW_BOOT_DIR="firmware/boot"           # contains fip.bin, boot.sd
#FW_BLOB_DIR="firmware/aic8800"        # -> /mnt/system/firmware/aic8800
#FW_KO_DIR="firmware/ko"               # -> /mnt/system/ko
#FW_BIN_DIR="firmware/bin"             # -> /usr/local/bin (duo-pinmux ...)
#FW_PINMAP="firmware/duos-map.txt"     # -> /usr/local/share/alpenglow/duos-map.txt
#FW_WIRINGX_DIR="firmware/wiringx"     # lib/ + include/
#FIRMWARE_ALT_DIR="/mnt/system/firmware/aic8800"  # image path for FW_BLOB_DIR (absolute)

# ---------------------------------------------------------------------------
# Runtime hardware description (baked verbatim into /etc/alpenglow/board.conf)
# Consumed on the device by alpenglow-led (LED_GPIO) and available to `all`.
# ---------------------------------------------------------------------------

#LED_GPIO=509
#LED_SYSFS="/sys/class/gpio/gpio${LED_GPIO}"
#THERMAL_ZONE="/sys/class/thermal/thermal_zone0"
#THERMAL_HOT_MC=80000

# Network interfaces (informational for now)
#ETH_IF="eth0"
#ETH_METRIC=100
#WIFI_IF="wlan0"
#WIFI_METRIC=300
#USB_IF="usb0"
#USB_GADGET_FUNC="rndis.usb0"
#USB_HOST_IP="192.168.42.1"
#USB_DHCP_RANGE="192.168.42.2,192.168.42.242,1h"

# Device specifics
#ROOT_DISK="/dev/mmcblk0"
#ROOT_PART="2"
#HAS_RTC="yes"
#FIRMWARE_DIR="/lib/firmware/..."
#FIRMWARE_FILES="..."
#GPIO_TOOL="libgpiod"
