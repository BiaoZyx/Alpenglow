# Alpenglow board profile: Milk-V Duo S (SG2000, ARM64, SD)
BOARD_NAME="milkv-duos"
ARCH="aarch64"

# Serial console
SERIAL_CONSOLE="ttyS0"
SERIAL_BAUD="115200"

# Storage
ROOT_DISK="/dev/mmcblk0"
ROOT_PART="2"
BOOT_SIZE_MB=64
ROOTFS_SIZE_MB=1024

# Network
ETH_IF="eth0"
ETH_METRIC=100
WIFI_IF="wlan0"
WIFI_METRIC=300
USB_IF="usb0"
USB_GADGET_FUNC="rndis.usb0"
USB_HOST_IP="192.168.42.1"
USB_DHCP_RANGE="192.168.42.2,192.168.42.242,1h"

# LED: no gpio-leds node in DT, official blink.sh uses GPIO 509 via sysfs
LED_GPIO=509
LED_SYSFS="/sys/class/gpio/gpio${LED_GPIO}"

# Thermal
THERMAL_ZONE="/sys/class/thermal/thermal_zone0"
THERMAL_HOT_MC=80000

# RTC: cvitek,rtc present in DT
HAS_RTC="yes"

# Firmware: AIC8800, filenames as-is, loaded via request_firmware()
FIRMWARE_DIR="/lib/firmware/aic8800"
FIRMWARE_ALT_DIR="/mnt/system/firmware/aic8800"
FIRMWARE_FILES="fw_adid_8800d80_u02.bin fw_patch_8800d80_u02.bin fw_patch_table_8800d80_u02.bin lmacfw_rf_8800d80_u02.bin fmacfwbt_8800d80_u02.bin fmacfw_8800d80_u02.bin aic_userconfig_8800d80.txt"

# GPIO tooling
PINMUX_TOOL=""          # duo-pinmux not in SDK, v1.1
GPIO_TOOL="libgpiod"

# zram: disabled in v1.0, kernel defconfig lacks CONFIG_ZRAM
ZRAM_ENABLED="no"
